name: Deploy

# Only a published release deploys, and it deploys both sites: apps/site to
# the Cloudflare Pages project cryptos-pki-www (cryptos-pki.com and
# www.cryptos-pki.com) and apps/docs to cryptos-pki-docs
# (docs.cryptos-pki.com). No push, pull_request or workflow_dispatch trigger:
# publishing the release is the one "go live" action for both sites.
#
# Each project is created on its first deploy if it doesn't exist yet. Custom
# domains are attached once by hand in Cloudflare after that -- see
# docs/deploy.md. The org secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID must hold real values; nothing here prints either.
on:
  release:
    types: [published]

permissions:
  contents: read

# Deploys queue rather than race: a second release (or an edit and
# republish) waits for the first deploy instead of cancelling it mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # A release marked pre-release goes to each project's dev branch
      # (dev.cryptos-pki-www.pages.dev, dev.cryptos-pki-docs.pages.dev), so it
      # can be checked before it reaches production; anything else goes to
      # main. --branch is always explicit, because a release run checks out a
      # detached tag and would otherwise deploy as a preview named "head".
      PAGES_BRANCH: ${{ github.event.release.prerelease && 'dev' || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The release's docs version must already be cut and merged: the
      # version in packages/frame/release.ts has to be in
      # apps/docs/versions.json, newest first. Nothing builds or deploys until
      # it is, so a release can't ship docs without its own version. The fix
      # is a PR that runs `npm run docs:version`, then publishing again.
      - name: Check the docs version for this release
        run: npm run check:docs-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Both sites build before either deploys, so a failed build never leaves
      # one site on the new release and the other on the old one.
      - name: Build the site (prerender)
        run: npm run build -w @cryptos-pki/site

      # The published docs leave out Next (unreleased main).
      - name: Build the docs
        env:
          DOCS_INCLUDE_NEXT: "false"
        run: npm run build -w @cryptos-pki/docs

      # Each step creates its Pages project on the first run only. `--json`
      # gives a real array of {"Project Name": ...} objects to match exactly,
      # instead of grep-ing wrangler's table output (which would also match a
      # longer name that merely starts with this one). wrangler isn't on the
      # PATH inside preCommands, so those calls go through npx.
      - name: Deploy the site to cryptos-pki-www
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | sed -n '/^\[/,$p' | jq -e '[.[] | select(."Project Name" == "cryptos-pki-www")] | length > 0' >/dev/null || npx wrangler pages project create cryptos-pki-www --production-branch=main
          command: pages deploy apps/site/build/client --project-name=cryptos-pki-www --branch=${{ env.PAGES_BRANCH }}

      - name: Deploy the docs to cryptos-pki-docs
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | sed -n '/^\[/,$p' | jq -e '[.[] | select(."Project Name" == "cryptos-pki-docs")] | length > 0' >/dev/null || npx wrangler pages project create cryptos-pki-docs --production-branch=main
          command: pages deploy apps/docs/build --project-name=cryptos-pki-docs --branch=${{ env.PAGES_BRANCH }}
