name: Deploy

# Builds the prerendered site and deploys it to Cloudflare Pages, but only
# when a GitHub Release is published. Nothing else triggers a deploy: no
# push, no pull_request, no workflow_dispatch. Publishing the release is the
# one and only "go live" action for this site.
#
# A release marked "pre-release" (an rc I tick by hand before publishing)
# deploys to the dev.cryptos-pki-www.pages.dev branch instead of production,
# so I can look at it before it reaches cryptos-pki.com. A normal release
# still deploys to the main branch, unchanged.
#
# The workflow creates the Cloudflare Pages project (cryptos-pki-www) the
# first time, when it doesn't exist yet. Its custom domains (cryptos-pki.com,
# www.cryptos-pki.com) are still attached once by hand in the Cloudflare
# dashboard -- see docs/deploy.md. The org secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID must hold real values before the first release is
# published; this workflow never prints either one.
on:
  release:
    types: [published]

permissions:
  contents: read

# Deploys queue rather than race: a release is a one-time event, but if two
# ever land close together (e.g. a published release immediately followed by
# an edit-and-republish), the second deploy should wait for the first to
# finish, not cancel it mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (prerender)
        run: npm run build

      - name: List the Cloudflare Pages projects
        id: projects
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list --json

      # Checked first so every release can run this step safely: the project
      # is created once, on the first deploy, and left alone after that.
      - name: Check for the cryptos-pki-www project
        id: exists
        env:
          PROJECTS: ${{ steps.projects.outputs.command-output }}
        run: |
          set -euo pipefail
          # Wrangler may print its banner ahead of the JSON array.
          if printf '%s\n' "$PROJECTS" | sed -n '/^\[/,$p' | jq -e 'any(.[]; ."Project Name" == "cryptos-pki-www")' >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the cryptos-pki-www project
        if: steps.exists.outputs.found == 'false'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create cryptos-pki-www --production-branch=main

      # A pre-release (rc) deploys to the dev branch instead of production, so
      # I can look at it on dev.cryptos-pki-www.pages.dev before publishing a
      # real release. Only the deploy target changes -- the build and project
      # above are the same either way.
      - name: Determine the deploy branch
        id: deploy-branch
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy build/client to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/client --project-name=cryptos-pki-www
            --branch=${{ steps.deploy-branch.outputs.name }}
